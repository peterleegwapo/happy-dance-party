<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Dance Party 🪩</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="entry" class="entry">
  <div class="entry-card">
    <div class="logo">🪩</div><h1>Happy Dance Party</h1>
    <p>今晚一起蹦个开心！</p>
    <label>你的昵称</label><input id="nickname" maxlength="14" placeholder="给自己起个名字" value="舞池新星">
    <button id="publicBtn" class="primary">🎉 进入公开舞池</button>
    <div class="split"><span>或者和朋友开派对</span></div>
    <input id="roomName" maxlength="18" placeholder="派对名称（可选）">
    <button id="createBtn" class="secondary">✨ 创建私人房间</button>
    <div class="join-row"><input id="roomCode" maxlength="6" placeholder="输入6位房间码"><button id="joinBtn">加入</button></div>
    <small>最多 30 位玩家同时在一个房间</small>
    <div id="entryError" class="error"></div>
  </div>
</div>
<div id="game" class="hidden">
  <header><div class="brand">🪩 <b>HAPPY DANCE</b></div><div class="room-label"><span id="roomTitle">公共蹦迪大厅</span> · <b id="playerCount">1/30</b></div><div class="top-actions"><button id="copyCode">复制房间码</button><button id="leaveBtn">离开</button></div></header>
  <main>
    <section class="stage-wrap">
      <div class="stage-top"><span>✨ LET'S PARTY ✨</span><span id="roomCodeLabel"></span></div>
      <canvas id="stage" width="1200" height="760"></canvas>
      <div class="mobile-hint">手机：使用左下角摇杆移动，右侧按钮跳舞</div>
      <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
      <div class="mobile-dances">
        <button data-dance="bounce">🕺</button><button data-dance="spin">💫</button><button data-dance="wave">👋</button>
      </div>
    </section>
    <aside>
      <div class="panel dance-panel"><h3>💃 舞蹈动作</h3><div class="dance-grid">
        <button data-dance="bounce">🕺<span>蹦蹦跳</span></button><button data-dance="spin">💫<span>转圈圈</span></button>
        <button data-dance="wave">👋<span>挥挥手</span></button><button data-dance="groove">🎶<span>摇摆舞</span></button>
        <button data-dance="heart">💗<span>比爱心</span></button><button data-dance="idle">😊<span>休息</span></button>
      </div></div>
      <div class="panel"><h3>👥 舞池玩家 <span id="listCount"></span></h3><div id="playerList" class="player-list"></div></div>
      <div class="panel chat-panel"><h3>💬 派对聊天</h3><div id="chatLog" class="chat-log"><div class="welcome">欢迎来到舞池！和大家打个招呼吧～</div></div><form id="chatForm"><input id="chatInput" maxlength="100" placeholder="说点什么..."><button>发送</button></form></div>
    </aside>
  </main>
  <footer>电脑：WASD / 方向键移动 · 手机：摇杆移动 · 选择舞蹈和大家一起嗨！</footer>
</div>
<script src="/socket.io/socket.io.js"></script><script src="game.js"></script>
</body></html>
